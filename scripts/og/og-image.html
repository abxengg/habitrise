<!doctype html>
<!-- Social share image for HabitRise (1200×630). Render: node scripts/og/render.mjs -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:Manrope,sans-serif;color:#121212;background:#fff;
    background-image:radial-gradient(55% 70% at 88% 18%,#fff4d1 0%,rgba(255,255,255,0) 70%),radial-gradient(40% 55% at 0% 95%,#e8eeff 0%,rgba(255,255,255,0) 70%)}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:center}
  .brand{display:flex;align-items:center;gap:14px;font-family:Anton;font-size:40px;letter-spacing:.01em}
  .brand img{height:52px}
  .brand small{display:block;font-family:Manrope;font-weight:800;font-size:12.5px;letter-spacing:.42em;color:#b8741a;margin-top:6px}
  h1{font-size:76px;line-height:1.02;letter-spacing:-.045em;font-weight:800;margin:34px 0 22px}
  mark{background:none;position:relative;white-space:nowrap}
  mark::before{content:"";position:absolute;left:-6px;right:-8px;bottom:.08em;height:.4em;z-index:-1;border-radius:8px;transform:rotate(-1.5deg);background:#f8af3c}
  mark.b::before{background:#c9d6ff}
  p{font-size:23px;font-weight:600;color:#55524c}
  .ticket{background:#f8af3c;border:3px solid #121212;border-radius:0;box-shadow:10px 10px 0 #121212;padding:30px;text-align:center}
  .tag{display:inline-block;background:#121212;color:#f8af3c;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
  .plans{display:grid;gap:12px;margin:20px 0 14px}
  .plan{background:rgba(255,255,255,.6);border:2.5px solid #121212;border-radius:0;padding:12px}
  .plan small{display:block;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .plan b{font-size:56px;letter-spacing:-.05em;line-height:1.05}
  .was{font-weight:700;font-size:18px}
  .was s{font-size:22px}
  .foot{position:absolute;left:72px;bottom:44px;font-weight:800;font-size:18px;color:#8f8a82;letter-spacing:.02em}
</style></head><body>
<div class="wrap">
  <div>
    <div class="brand"><img src="../../public/img/brand/mark-black.png"><div>HABITRISE<small>BUILD THE SYSTEM</small></div></div>
    <h1>Rise at 6.<br>Keep the <mark>streak.</mark><br>Change your <mark class="b">life.</mark></h1>
    <p>The 21-day live habit challenge · S.A.V.E.R.S routine</p>
  </div>
  <div class="ticket">
    <span class="tag">Admit one</span>
    <div class="plans">
      <div class="plan"><small>Every morning</small><b>6:00 AM</b></div>
      <div class="plan"><small>Live challenge</small><b>21 days</b></div>
    </div>
    <div class="was">Next cohort starts Monday</div>
  </div>
</div>
<div class="foot">6:00 AM IST · Live on Zoom · Private Skool community</div>
</body></html>
