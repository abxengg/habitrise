# Content Management for HabitRise — Pages CMS (https://app.pagescms.org)
# Every word on the website lives in src/content/*.json. Editing a field here and pressing
# Save commits to the repo; GitHub Actions rebuilds the site and it is live in ~1 minute.
# Watch progress at <site>/deploys.
#
# Text can use these placeholders, filled in automatically:
#   {currency} {studentPrice} {othersPrice} {originalPrice} {year} {nextMonday}

media:
  input: public/img
  output: /img

content:
  # ───────────────────────────── Site settings ─────────────────────────────
  - name: settings
    label: "⚙️ Site settings, prices & payment"
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - { name: name, label: Brand name, type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - { name: wordmark, label: Logo wordmark (capitals), type: string }
          - { name: taglineUpper, label: Logo tagline (capitals), type: string }
      - name: pricing
        label: Prices & payment links
        type: object
        description: "Prices update every page. Paste the Razorpay payment links here when ready."
        fields:
          - { name: originalPrice, label: Regular price (shown struck through), type: number, required: true, options: { min: 0 } }
          - { name: currencySymbol, label: Currency symbol, type: string }
          - name: student
            label: Student plan
            type: object
            fields:
              - { name: label, label: Plan name, type: string }
              - { name: price, label: Price, type: number, required: true, options: { min: 0 } }
              - { name: note, label: Short note, type: text }
              - { name: paymentUrl, label: Razorpay payment link, type: string, description: "After the form is submitted, students are sent here. Leave empty to show the 'we'll WhatsApp you' message." }
          - name: others
            label: Everyone-else plan
            type: object
            fields:
              - { name: label, label: Plan name, type: string }
              - { name: price, label: Price, type: number, required: true, options: { min: 0 } }
              - { name: note, label: Short note, type: text }
              - { name: paymentUrl, label: Razorpay payment link, type: string, description: "Everyone else is sent here after the form." }
          - { name: includes, label: What's included (list), type: string, list: true }
      - name: forms
        label: Forms
        type: object
        fields:
          - { name: endpoint, label: Form receiver URL (Google Apps Script), type: string, description: "The Web app URL ending in /exec. See scripts/google-apps-script/SETUP.md." }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: whatsapp, label: WhatsApp link, type: string, description: "Format: https://wa.me/91XXXXXXXXXX" }
          - { name: whatsappLabel, label: WhatsApp button label (for screen readers), type: string }
      - name: socials
        label: Social links
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: facebook, label: Facebook, type: string }
      - name: header
        label: Top menu
        type: object
        fields:
          - name: links
            label: Menu links
            type: object
            list: { collapsible: { collapsed: true, summary: "{label}" } }
            fields:
              - { name: label, label: Text, type: string }
              - { name: href, label: Link, type: string, description: "e.g. /about, /#pricing or a full https:// link" }
          - { name: button, label: Button text, type: string }
          - { name: buttonHref, label: Button link, type: string }
          - { name: menuLabel, label: Phone menu button label (screen readers), type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - name: columns
            label: Link columns
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Column title, type: string }
              - name: links
                label: Links
                type: object
                list: { collapsible: { collapsed: true, summary: "{label}" } }
                fields:
                  - { name: label, label: Text, type: string }
                  - { name: href, label: Link, type: string }
          - { name: copyright, label: Copyright line, type: string, description: "{year} becomes the current year" }
          - name: legal
            label: Legal links
            type: object
            list: true
            fields:
              - { name: label, label: Text, type: string }
              - { name: href, label: Link, type: string }
      - name: seo
        label: SEO (search & social sharing)
        type: object
        fields:
          - { name: siteUrl, label: Website address, type: string }
          - { name: defaultTitle, label: Default page title, type: string }
          - { name: titleSuffix, label: Title ending added to inner pages, type: string }
          - { name: defaultDescription, label: Default description (Google snippet), type: text, options: { maxlength: 300 } }
          - { name: keywords, label: Keywords, type: text }
          - { name: ogImage, label: Share image path, type: string }
          - { name: ogImageAlt, label: Share image description, type: string }
          - { name: locale, label: Locale, type: string }
          - { name: twitterHandle, label: X/Twitter handle (optional), type: string }
      - name: deploys
        label: Deploy status page (technical)
        type: object
        fields:
          - { name: repo, label: GitHub repository, type: string, readonly: true }
          - { name: workflow, label: Workflow file, type: string, readonly: true }
      - name: dates
        label: Dates
        type: object
        fields:
          - { name: nextCohortPrefix, label: Text before the next-cohort date, type: string, description: "e.g. 'Monday, ' → Monday, 24 Nov" }

  # ─────────────────────────────── Home page ───────────────────────────────
  - name: home
    label: "🏠 Home page"
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title (browser tab & Google), type: string }
          - { name: description, label: Description (Google snippet), type: text, options: { maxlength: 300 } }
      - name: hero
        label: Top section (hero)
        type: object
        fields:
          - { name: badge, label: Small badge, type: string }
          - { name: line1, label: Headline line 1, type: string }
          - { name: line2, label: Headline line 2, type: string }
          - { name: line2Highlight, label: Line 2 highlighted word, type: string }
          - { name: line3, label: Headline line 3, type: string }
          - { name: line3Highlight, label: Line 3 highlighted word, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: primaryButton, label: Main button text, type: string }
          - { name: secondaryButton, label: Second button text, type: string }
          - { name: points, label: Small points under the buttons, type: string, list: true }
      - name: tracker
        label: Streak tracker card
        type: object
        fields:
          - { name: stickerPoints, label: Sticker — points, type: string }
          - { name: stickerLive, label: Sticker — live, type: string }
          - { name: stickerRating, label: Sticker — rating, type: string }
          - { name: greeting, label: Greeting, type: string }
          - { name: title, label: Card title, type: string }
          - { name: ofDays, label: "'of days' text", type: string }
          - { name: statusStart, label: Status — no days ticked, type: string }
          - { name: statusGrowing, label: Status — 1 to 6 days, type: string }
          - { name: statusOnFire, label: Status — 7 to 20 days, type: string }
          - { name: statusDone, label: Status — all 21 days, type: string }
          - { name: todayLabel, label: "'Today' label", type: string }
          - { name: hint, label: Hint under the card, type: string }
          - { name: ariaLabel, label: Screen-reader label, type: string }
      - name: audienceStrip
        label: Scrolling audience strip
        type: object
        fields:
          - { name: ariaLabel, label: Screen-reader label, type: string }
          - { name: items, label: Words, type: string, list: true }
      - name: savers
        label: The six S.A.V.E.R.S habits
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Habit name, type: string }
      - name: how
        label: How it works
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - name: cards
            label: Three cards
            type: object
            list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{time} — {title}" } }
            fields:
              - { name: time, label: Time, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
          - { name: liveTag, label: LIVE tag, type: string }
          - { name: attendees, label: Attendees text, type: string }
          - name: post
            label: Example community post
            type: object
            fields:
              - { name: name, label: Name, type: string }
              - { name: day, label: Day, type: string }
              - { name: text, label: Post text, type: string }
              - { name: likes, label: Likes, type: string }
              - { name: comments, label: Comments, type: string }
              - { name: points, label: Points, type: string }
      - name: stats
        label: Numbers row
        type: object
        list: { min: 4, max: 4, collapsible: { collapsed: true, summary: "{value} {label}" } }
        fields:
          - { name: value, label: Number, type: string }
          - { name: label, label: Label, type: string }
      - name: program
        label: The program (21 days)
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: levelLabel, label: "'Level' word", type: string }
          - { name: dayLabel, label: "'Day' word", type: string }
          - name: weeks
            label: Weeks
            type: object
            list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{days} — {title}" } }
            fields:
              - { name: days, label: Days, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Description, type: text }
              - { name: lessons, label: Daily lessons (7), type: string, list: { min: 7, max: 7 } }
      - name: community
        label: Community (Skool)
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: groupName, label: Group name, type: string }
          - { name: groupMeta, label: Group details line, type: string }
          - { name: groupText, label: Group description, type: text }
          - { name: membersMore, label: Members text, type: string }
          - { name: button, label: Button text, type: string }
          - { name: leaderboardTitle, label: Leaderboard title, type: string }
          - { name: levelsTitle, label: Levels title, type: string }
          - name: levels
            label: Levels
            type: object
            list: { collapsible: { collapsed: true, summary: "Level {level} — {name}" } }
            fields:
              - { name: level, label: Level number, type: string }
              - { name: name, label: Level name, type: string }
          - { name: note, label: Small note, type: string }
      - name: founderSection
        label: Founder section (name, bio & quote are under "Founder")
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: button, label: Button text, type: string }
      - name: stories
        label: Success stories (group chat)
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: chatTitle, label: Chat title, type: string }
          - { name: chatMembers, label: Chat members text, type: string }
          - name: items
            label: Stories
            type: object
            list: { collapsible: { collapsed: true, summary: "{name} — {result}" } }
            fields:
              - { name: name, label: Name, type: string }
              - { name: role, label: Role, type: string }
              - { name: place, label: City, type: string }
              - { name: result, label: Result tag, type: string }
              - { name: quote, label: Story, type: text }
      - name: pricing
        label: Early-bird ticket (prices are in Site settings)
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: ticketLabel, label: Ticket top label, type: string }
          - { name: programName, label: Programme name, type: string }
          - name: details
            label: Ticket details
            type: object
            list: { collapsible: { collapsed: true, summary: "{label}: {value}" } }
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string, description: "{nextMonday} shows the next cohort date" }
          - { name: stubTag, label: Stub tag, type: string }
          - { name: regularLabel, label: "'Regular' word", type: string }
          - { name: button, label: Button text, type: string }
          - { name: payNote, label: Payment note, type: string }
          - { name: serial, label: Ticket serial, type: string }
      - name: faq
        label: FAQ
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - name: items
            label: Questions
            type: object
            list: { collapsible: { collapsed: true, summary: "{q}" } }
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
      - name: final
        label: Bottom call-to-action card
        type: object
        fields:
          - { name: title, label: Heading (before the date), type: string }
          - { name: titleEnd, label: Heading end (after the date), type: string }
          - { name: text, label: Paragraph, type: string }
          - { name: button, label: Button text, type: string }

  # ──────────────────────────────── Founder ────────────────────────────────
  - name: founder
    label: "👤 Founder (Mani)"
    type: file
    path: src/content/founder.json
    format: json
    fields:
      - { name: name, label: Full name, type: string }
      - { name: shortName, label: Short name, type: string }
      - { name: role, label: Role line, type: string }
      - { name: jobTitle, label: Job title (for Google), type: string }
      - { name: quote, label: Quote, type: text }
      - { name: homeBio, label: Bio on the home page, type: text }
      - { name: bio, label: Experience paragraphs (founder page), type: text, list: true }
      - { name: credentials, label: Credential chips, type: string, list: true }
      - { name: education, label: Education, type: string, list: true }
      - name: journey
        label: Journey (3 steps)
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: story
        label: Story chapters
        type: object
        list: { collapsible: { collapsed: true, summary: "{heading}" } }
        fields:
          - { name: heading, label: Chapter title, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
      - name: coaching
        label: Coaching areas
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  # ────────────────────────────── Founder page ─────────────────────────────
  - name: about
    label: "📖 Founder page"
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Description, type: text, options: { maxlength: 300 } }
      - name: hero
        label: Top section
        type: object
        fields:
          - { name: badge, label: Badge, type: string }
          - { name: titleBefore, label: Heading, type: string }
          - { name: titleHighlight, label: Highlighted word, type: string }
          - { name: stickerTop, label: Photo sticker (top), type: string }
          - { name: stickerBottom, label: Photo sticker (bottom), type: string }
          - { name: photoAlt, label: Photo description, type: string }
      - name: story
        label: Story section
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: chapterLabel, label: "'Chapter' word", type: string }
      - name: side
        label: Side cards
        type: object
        fields:
          - { name: experienceTitle, label: Experience title, type: string }
          - { name: educationTitle, label: Education title, type: string }
      - name: coaching
        label: Coaching section
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
      - name: final
        label: Bottom card
        type: object
        fields:
          - { name: titleBefore, label: Heading, type: string }
          - { name: titleHighlight, label: Highlighted words, type: string }
          - { name: text, label: Paragraph, type: string }
          - { name: button, label: Button text, type: string }

  # ───────────────────────────── Services page ─────────────────────────────
  - name: services
    label: "🧭 Services page"
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Description, type: text, options: { maxlength: 300 } }
      - name: hero
        label: Top section
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
      - name: services
        label: Services
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: id, label: Short id (no spaces), type: string, pattern: "^[a-z0-9-]+$" }
          - { name: title, label: Title, type: string }
          - { name: tagline, label: Tag, type: string }
          - { name: text, label: Description, type: text }
          - { name: points, label: Points, type: string, list: true }
          - { name: price, label: Price text, type: string }
          - { name: button, label: Button text, type: string }
          - { name: buttonHref, label: Button link, type: string, description: "#interest opens the interest form; /register goes to registration" }
      - name: interest
        label: Interest form
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: nameLabel, label: Name label, type: string }
          - { name: namePlaceholder, label: Name placeholder, type: string }
          - { name: phoneLabel, label: Phone label, type: string }
          - { name: phonePlaceholder, label: Phone placeholder, type: string }
          - { name: emailLabel, label: Email label, type: string }
          - { name: emailPlaceholder, label: Email placeholder, type: string }
          - { name: serviceLabel, label: Service label, type: string }
          - { name: organisationLabel, label: Organisation label, type: string }
          - { name: organisationPlaceholder, label: Organisation placeholder, type: string }
          - { name: messageLabel, label: Message label, type: string }
          - { name: messagePlaceholder, label: Message placeholder, type: string }
          - { name: submit, label: Button text, type: string }
          - { name: sending, label: While sending, type: string }
          - { name: success, label: Success message, type: text }
          - { name: error, label: Error message, type: text }
          - { name: notConfigured, label: Message before the form is connected, type: text }

  # ───────────────────────────── Register page ─────────────────────────────
  - name: register
    label: "📰 Register page (newspaper)"
    type: file
    path: src/content/register.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Description, type: text, options: { maxlength: 300 } }
      - name: masthead
        label: Newspaper masthead
        type: object
        fields:
          - { name: name, label: Newspaper name, type: string }
          - { name: motto, label: Motto, type: string }
          - { name: edition, label: Edition (top left), type: string }
          - { name: priceLine, label: Price line (top right), type: string }
          - { name: location, label: Line under the masthead, type: string }
      - name: lead
        label: Lead story
        type: object
        fields:
          - { name: kicker, label: Kicker (black label), type: string }
          - { name: headline, label: Headline, type: string, description: "{nextMonday} shows the next cohort date" }
          - { name: deck, label: Sub-headline, type: text }
          - { name: byline, label: Byline, type: string }
      - name: columns
        label: Story columns
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Column title, type: string }
          - { name: text, label: Column text, type: text }
      - name: ads
        label: Price classifieds
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: studentHeadline, label: Student ad headline, type: string }
          - { name: othersHeadline, label: Everyone-else ad headline, type: string }
          - { name: regularLabel, label: "'Regular' word", type: string }
          - { name: perPerson, label: Price note, type: string }
      - name: form
        label: Registration coupon (form)
        type: object
        fields:
          - { name: title, label: Coupon title, type: string }
          - { name: subtitle, label: Coupon subtitle, type: string }
          - { name: planLabel, label: Plan label, type: string }
          - { name: nameLabel, label: Name label, type: string }
          - { name: namePlaceholder, label: Name placeholder, type: string }
          - { name: emailLabel, label: Email label, type: string }
          - { name: emailPlaceholder, label: Email placeholder, type: string }
          - { name: phoneLabel, label: Phone label, type: string }
          - { name: phonePlaceholder, label: Phone placeholder, type: string }
          - { name: collegeLabel, label: College label, type: string }
          - { name: collegePlaceholder, label: College placeholder, type: string }
          - { name: cityLabel, label: City label, type: string }
          - { name: cityPlaceholder, label: City placeholder, type: string }
          - { name: ageLabel, label: Age label, type: string }
          - { name: occupationLabel, label: Occupation label, type: string }
          - { name: occupationOptions, label: Occupation choices, type: string, list: true }
          - { name: sourceLabel, label: "'How did you hear' label", type: string }
          - { name: sourceOptions, label: "'How did you hear' choices", type: string, list: true }
          - { name: consent, label: Consent checkbox text, type: text }
          - { name: submit, label: Button text, type: string }
          - { name: sending, label: While saving, type: string }
          - { name: redirecting, label: While going to payment, type: string }
          - { name: noPaymentLink, label: Message when no Razorpay link is set, type: text }
          - { name: error, label: Error message, type: text }
          - { name: notConfigured, label: Message before the form is connected, type: text }
          - { name: secureNote, label: Security note, type: string }
