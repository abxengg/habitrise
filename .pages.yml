          - { name: text, label: Paragraph, type: text }
          - { name: groupName, label: Group name, type: string }
          - { name: groupMeta, label: Group details line, type: string }
          - { name: groupText, label: Group description, type: text }
          - { name: membersMore, label: Members text, type: string }
          - { name: button, label: Button text, type: string }
          - { name: leaderboardTitle, label: Leaderboard title, type: string }
          - { name: levelsTitle, label: Levels title, type: string }
          - name: levels
            label: Levels
            type: object
            list: { collapsible: { collapsed: true, summary: "Level {level} — {name}" } }
            fields:
              - { name: level, label: Level number, type: string }
              - { name: name, label: Level name, type: string }
          - { name: note, label: Small note, type: string }
      - name: founderSection
        label: Founder section (name, bio & quote are under "Founder")
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
          - { name: title, label: Heading, type: string }
          - { name: button, label: Button text, type: string }
      - name: stories
        label: Success stories (group chat)
        type: object
        fields:
          - { name: tag, label: Section tag, type: string }
