# Content Management for HabitRise — Pages CMS (https://app.pagescms.org)
# Every word on the website lives in src/content/*.json. Editing a field here and pressing
# Save stores the change in the repo. Nothing goes live until someone presses "Redeploy site"
# (sidebar → Actions); then GitHub Actions builds the site and it is live in ~1 minute.
#
# Text can use these placeholders, filled in automatically:
#   {currency} {studentPrice} {othersPrice} {originalPrice} {year} {nextMonday}

# Buttons that run a GitHub workflow (.github/workflows/)
actions:
  - name: redeploy
    label: Redeploy site
    workflow: pages.yml
    ref: current
    cancelable: false
    confirm:
      title: Publish your changes?
      message: Everything saved so far goes live on the website in about a minute.
      button: Redeploy

media:
  input: public/img
  output: /img

content:
  # ───────────────────────────── Site settings ─────────────────────────────
  - name: settings
    label: "⚙️ Site settings, prices & payment"
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: brand
        label: Brand
        type: object
        fields:
          - { name: name, label: Brand name, type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - { name: wordmark, label: Logo wordmark (capitals), type: string }
          - { name: taglineUpper, label: Logo tagline (capitals), type: string }
      - name: pricing
        label: Prices & payment links
        type: object
        description: "Prices update every page. Paste the Razorpay payment links here when ready."
        fields:
          - { name: originalPrice, label: Regular price (shown struck through), type: number, required: true, options: { min: 0 } }
          - { name: currencySymbol, label: Currency symbol, type: string }
          - name: student
            label: Student plan
            type: object
            fields:
              - { name: label, label: Plan name, type: string }
              - { name: price, label: Price, type: number, required: true, options: { min: 0 } }
              - { name: note, label: Short note, type: text }
              - { name: paymentUrl, label: Razorpay payment link, type: string, description: "After the form is submitted, students are sent here. Leave empty to show the 'we'll WhatsApp you' message." }
          - name: others
            label: Professionals plan
            type: object
            fields:
              - { name: label, label: Plan name, type: string }
              - { name: price, label: Price, type: number, required: true, options: { min: 0 } }
              - { name: note, label: Short note, type: text }
              - { name: paymentUrl, label: Razorpay payment link, type: string, description: "Professionals are sent here after the form." }
          - { name: includes, label: What's included (list), type: string, list: true }
      - name: forms
        label: Forms
        type: object
        fields:
          - { name: endpoint, label: Form receiver URL (Google Apps Script), type: string, description: "The Web app URL ending in /exec. See scripts/google-apps-script/SETUP.md." }
          - { name: countryCode, label: Phone country code, type: string, description: "Shown before every phone field, e.g. +91" }
      - name: newsletter
        label: Newsletter signup (bottom of every page)
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: nameLabel, label: Name label (screen readers), type: string }
          - { name: namePlaceholder, label: Name placeholder, type: string }
          - { name: emailLabel, label: Email label (screen readers), type: string }
          - { name: emailPlaceholder, label: Email placeholder, type: string }
          - { name: button, label: Button text, type: string }
          - { name: sending, label: While sending, type: string }
          - { name: success, label: Success message, type: text }
          - { name: error, label: Error message, type: text }
          - { name: notConfigured, label: Message before the form is connected, type: text }
          - { name: note, label: Small note under the form, type: string }
          - { name: subscribedAs, label: "'Subscribed as' text (shown with their email after signing up)", type: string }
          - { name: thanks, label: Thank-you line after signing up, type: string }
          - { name: another, label: Link to subscribe another email, type: string }
          - { name: toLabel, label: "'To' label on the letter", type: string }
          - { name: stamp, label: Text on the stamp, type: string }
          - { name: postmark, label: Text in the postmark circle, type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: whatsapp, label: WhatsApp link, type: string, description: "Format: https://wa.me/91XXXXXXXXXX" }
          - { name: whatsappLabel, label: WhatsApp button label (for screen readers), type: string }
          - { name: instagramLabel, label: Instagram button label (for screen readers), type: string }
          - { name: linkedinLabel, label: LinkedIn button label (for screen readers), type: string }
          - { name: contactLabel, label: Phone contact button label (for screen readers), type: string }
          - { name: closeLabel, label: Phone contact close label (for screen readers), type: string }
      - name: socials
        label: Social links
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: facebook, label: Facebook, type: string }
      - name: header
        label: Top menu
        type: object
        fields:
          - name: links
            label: Menu links
            type: object
            list: { collapsible: { collapsed: true, summary: "{label}" } }
            fields:
              - { name: label, label: Text, type: string }
              - { name: href, label: Link, type: string, description: "e.g. /about, /services or a full https:// link" }
              - { name: short, label: Short text for the phone tab bar, type: string }
              - { name: inNav, label: Show in the top menu (computer/tablet), type: boolean }
              - { name: inTabBar, label: Show in the phone tab bar, type: boolean, description: "Keep 4 switched on so Join stays in the middle" }
          - { name: button, label: Button text, type: string }
          - { name: buttonHref, label: Button link, type: string }
          - { name: menuLabel, label: Phone menu label (screen readers), type: string }
          - { name: tabJoin, label: Join button in the phone tab bar, type: string }
          - { name: skipLabel, label: "'Skip to content' link (for keyboard users)", type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - name: columns
            label: Link columns
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Column title, type: string }
              - name: links
                label: Links
                type: object
                list: { collapsible: { collapsed: true, summary: "{label}" } }
                fields:
                  - { name: label, label: Text, type: string }
                  - { name: href, label: Link, type: string }
          - { name: copyright, label: Copyright line, type: string, description: "{year} becomes the current year" }
          - name: legal
            label: Legal links
            type: object
            list: true
            fields:
              - { name: label, label: Text, type: string }
              - { name: href, label: Link, type: string }
          - { name: versionLabel, label: "'Version' word (screen readers; the number is automatic)", type: string }
          - name: credit
            label: Maker's credit
            type: object
            fields:
              - { name: label, label: Text, type: string }
              - { name: name, label: Name, type: string }
              - { name: url, label: Link, type: string }
      - name: seo
        label: SEO (search & social sharing)
        type: object
        fields:
          - { name: siteUrl, label: Website address, type: string }
          - { name: defaultTitle, label: Default page title, type: string }
          - { name: titleSuffix, label: Title ending added to inner pages, type: string }
          - { name: defaultDescription, label: Default description (Google snippet), type: text, options: { maxlength: 300 } }
          - { name: keywords, label: Keywords, type: text }
          - { name: ogImage, label: Share image path, type: string }
          - { name: ogImageAlt, label: Share image description, type: string }
          - { name: locale, label: Locale, type: string }
          - { name: twitterHandle, label: X/Twitter handle (optional), type: string }
      - name: dates
        label: Dates
        type: object
        fields:
          - { name: nextCohortPrefix, label: Text before the next-cohort date, type: string, description: "e.g. 'Monday, ' → Monday, 24 Nov" }
          - { name: fallbackDay, label: Shown for a moment before the date loads, type: string }
      - name: notFound
        label: "'Page not found' (404) page"
        type: object
        fields:
          - { name: title, label: Browser-tab title, type: string }
          - { name: description, label: Search description, type: string }
          - { name: tag, label: Tag, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: button, label: Button text, type: string }

  # ─────────────────────────────── Home page ───────────────────────────────
