name: Deploy to GitHub Pages
# The site goes live ONLY when someone presses "Redeploy site" in Pages CMS (or runs this workflow by
# hand from the Actions tab). Saving in the CMS just stores the change; edits pile up until Redeploy.
# Each deploy tags the deployed commit with the next patch version (v1.0.1 → v1.0.2 …) and the tag
# message lists every change since the previous version. A Redeploy with no new changes adds no version.
# For a bigger jump (v1.1.0, v2.0.0), push that tag by hand; the count continues from there.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Sent by Pages CMS (who pressed Redeploy, which branch). Leave empty when running by hand.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for https://abxengg.github.io/habitrise/
        run: npm run build
        env:
          SITE_URL: https://abxengg.github.io
          BASE_PATH: /habitrise
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  version:
    name: Tag version (patch + 1)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this deploy
        run: |
          # a re-run or manual redeploy of an already-tagged commit gets no new version
          if git tag --points-at "$GITHUB_SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Already tagged: $(git tag --points-at "$GITHUB_SHA")"; exit 0
          fi
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          IFS=. read -r major minor patch <<< "${last:-v1.0.0}"
          next="${major}.${minor}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the tag message lists every change since the previous version
          changes=$(git log --no-merges --format='- %s' "${last:+$last..}$GITHUB_SHA" | head -n 50)
          git tag -a "$next" -m "Deployed by $GITHUB_ACTOR" -m "${changes:-- Redeploy}" "$GITHUB_SHA"
          git push origin "$next"
          { echo "### Deployed $next"; echo; echo "$changes"; } >> "$GITHUB_STEP_SUMMARY"
